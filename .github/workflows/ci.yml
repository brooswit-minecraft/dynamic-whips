name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Run GameTests headless (rope core and whip acceptance criteria)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log

          # runGameTestServer's exit code only counts *required* test failures, so a missing
          # Sable download or a zero-tests run can exit 0 with no rope coverage at all and no
          # visible sign anything is wrong (see docs/rope-core.md's CI history). Assert the
          # expected outcome from the step's own log instead of trusting the exit code: the
          # "N GAME TESTS COMPLETE" line must be present, and N must match the number of
          # @GameTest methods actually registered anywhere in this module (MINECRAFT-86 added
          # WhipGameTests.java alongside the original RopeGameTests.java, so this now scans the
          # whole dynamicwhips source tree instead of naming one file — a new GameTest file that
          # forgets to register at all is exactly the failure mode this count exists to catch).
          expected_tests=$(grep -rhoE '@GameTest\(' \
            src/main/java/io/github/brooswitminecraft/dynamicwhips \
            | wc -l)
          actual_tests=$(grep -oE '[0-9]+ GAME TESTS COMPLETE' gametest.log | grep -oE '^[0-9]+' | tail -1)
          if [ -z "$actual_tests" ]; then
            echo "::error::'GAME TESTS COMPLETE' never appeared in the GameTest output -- a missing" \
                 "Sable download or a server that never reached the test runner would look exactly" \
                 "like this with exit code 0"
            exit 1
          fi
          if [ "$actual_tests" != "$expected_tests" ]; then
            echo "::error::expected $expected_tests GAME TESTS COMPLETE (one per @GameTest method" \
                 "anywhere under dynamicwhips) but the log reports $actual_tests -- a test failed to" \
                 "register at all, which runGameTestServer's exit code alone would not have caught"
            exit 1
          fi
          echo "$actual_tests/$expected_tests registered GameTests ran to completion"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-whips
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'
